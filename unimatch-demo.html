<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniMatch — Find your fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6FB;
  --surface:#FFFFFF;
  --surface-2:#FBFBFE;
  --primary:#5B4FE0;
  --primary-dark:#463AC4;
  --primary-100:#EDEBFC;
  --primary-200:#D9D5F8;
  --ink:#181829;
  --ink-soft:#5B5B70;
  --ink-faint:#9797A8;
  --border:#E7E7F1;
  --like:#22C55E;
  --like-bg:#E9FBF0;
  --dislike:#F2456B;
  --dislike-bg:#FEEDF1;
  --reach:#F2456B;
  --reach-bg:#FEEDF1;
  --target:#F5A524;
  --target-bg:#FFF6E5;
  --likely:#22C55E;
  --likely-bg:#E9FBF0;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-card:0 10px 30px -12px rgba(24,24,41,0.16);
  --shadow-soft:0 2px 10px rgba(24,24,41,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.num, .display{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--primary-200);}

/* ---------- App shell ---------- */
#app{min-height:100vh;display:flex;}
.hidden{display:none !important;}

/* ---------- Onboarding ---------- */
#onboarding{
  width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;
  gap:28px;padding:32px 20px;background:
    radial-gradient(circle at 12% 20%, rgba(91,79,224,.07), transparent 45%),
    radial-gradient(circle at 88% 78%, rgba(139,124,246,.08), transparent 45%);
}
.ob-card{
  width:100%;max-width:760px;background:var(--surface);border-radius:24px;
  box-shadow:var(--shadow-card);padding:44px 48px;position:relative;overflow:hidden;flex-shrink:0;
}
.ob-top-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
.lang-switch{display:flex;gap:2px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:100px;padding:3px;}
.lang-btn{border:none;background:transparent;padding:5px 13px;border-radius:100px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--ink-faint);}
.lang-btn.active{background:var(--primary);color:#fff;}
.ob-side{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;}
.ob-side-left{align-items:flex-end;}
.ob-side-right{align-items:flex-start;margin-top:120px;}
.ob-fact{
  width:190px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;
  box-shadow:var(--shadow-soft);
}
.ob-fact-icon{font-size:20px;margin-bottom:6px;}
.ob-fact p{margin:0;font-size:12px;color:var(--ink-soft);line-height:1.5;}
@media (max-width:1180px){ .ob-side{display:none;} }
.ob-progress{display:flex;gap:6px;margin-bottom:28px;}
.ob-progress i{flex:1;height:4px;border-radius:4px;background:var(--border);transition:background .3s;}
.ob-progress i.done{background:var(--primary);}
.ob-eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700;margin:0 0 6px;}
.ob-title{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;margin:0 0 8px;line-height:1.2;}
.ob-sub{color:var(--ink-soft);font-size:14.5px;margin:0 0 28px;line-height:1.5;}
.field{margin-bottom:20px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;}
.field input[type=text], .field input[type=number], .field select{
  width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14.5px;background:var(--surface-2);color:var(--ink);transition:border-color .15s;
}
.field input:focus, .field select:focus{outline:none;border-color:var(--primary);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chip-group{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:9px 16px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface-2);
  font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:all .15s;user-select:none;
}
.chip:hover{border-color:var(--primary-200);}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.slider-row{display:flex;align-items:center;gap:14px;}
.slider-row input[type=range]{flex:1;accent-color:var(--primary);}
.slider-val{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--primary);min-width:70px;text-align:right;font-size:14px;}
.test-rows{display:flex;flex-direction:column;gap:10px;}
.test-row{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2);transition:border-color .15s, background .15s;}
.test-row.is-on{border-color:var(--primary-200);background:var(--surface);}
.test-row-head{display:flex;align-items:center;justify-content:space-between;}
.test-row-name{font-weight:800;font-size:14px;letter-spacing:.02em;}
.switch{position:relative;display:inline-block;cursor:pointer;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch-track{display:block;width:40px;height:23px;border-radius:100px;background:var(--border);transition:background .15s;position:relative;}
.switch-thumb{position:absolute;top:2.5px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;}
.switch input:checked + .switch-track{background:var(--primary);}
.switch input:checked + .switch-track .switch-thumb{transform:translateX(16px);}
.test-row-score{display:flex;align-items:center;gap:10px;margin-top:10px;}
.test-row-score input{width:110px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--surface);}
.test-row-score input:focus{outline:none;border-color:var(--primary);}
.test-row-hint{font-size:11.5px;color:var(--ink-faint);}
.test-row-note{margin:8px 0 0;font-size:11.5px;color:var(--ink-faint);line-height:1.4;}
.ob-nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;}
.btn{
  border:none;border-radius:100px;padding:13px 26px;font-weight:700;font-size:14.5px;
  transition:transform .12s, box-shadow .12s, background .15s; display:inline-flex;align-items:center;gap:8px;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px -8px rgba(91,79,224,.6);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:var(--ink-faint);box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:13px 10px;}
.btn-ghost:hover{color:var(--ink);}

/* World map */
.map-wrap{background:linear-gradient(180deg,#EEF0FC,#E4E7FA);border-radius:var(--radius-md);border:1.5px solid var(--border);padding:18px;margin-bottom:18px;}
.map-hint{font-size:12.5px;color:var(--ink-faint);margin:0 0 10px;}
svg.worldmap{width:100%;height:auto;display:block;}
.ocean-bg{fill:url(#oceanGrad);}
.ocean-dot{fill:#fff;opacity:.35;}
.continent{stroke:rgba(255,255,255,.8);stroke-width:2.5;cursor:pointer;transition:transform .2s ease, filter .2s ease;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 3px 6px rgba(24,24,41,.12));}
.continent:hover{transform:scale(1.035) translateY(-2px);filter:drop-shadow(0 8px 16px rgba(91,79,224,.28));}
.continent.selected{filter:drop-shadow(0 10px 20px rgba(91,79,224,.4));}
.continent-group{cursor:pointer;}
.continent-label{font-size:12px;font-weight:800;fill:#fff;pointer-events:none;font-family:'Space Grotesk',sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.25);}
.continent-count{font-size:9.5px;font-weight:700;fill:rgba(255,255,255,.85);pointer-events:none;font-family:'Inter',sans-serif;}
.continent-check{opacity:0;transition:opacity .15s;}
.continent-group.is-selected .continent-check{opacity:1;}
.country-panel{margin-top:14px;}
.country-panel h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 8px;}

/* ---------- Main app layout ---------- */
#mainapp{display:flex;width:100%;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:24px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.logo{display:flex;align-items:center;gap:9px;padding:0 8px;margin-bottom:30px;}
.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#8B7CF6);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.logo-text{font-family:'Space Grotesk';font-weight:700;font-size:18px;}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink-soft);
  font-weight:600;font-size:14px;margin-bottom:2px;background:none;border:none;width:100%;text-align:left;
}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--primary-100);color:var(--primary);}
.sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);}
.sidebar-foot .lang-switch{margin-bottom:10px;}
.mini-profile{display:flex;align-items:center;gap:10px;padding:8px;}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8B7CF6,#5B4FE0);flex-shrink:0;}
.mini-profile-name{font-size:13px;font-weight:700;}
.mini-profile-sub{font-size:11.5px;color:var(--ink-faint);}
.mini-profile-sub2{font-size:10.5px;color:var(--ink-faint);opacity:.8;}
.restart-btn{width:100%;margin-top:10px;background:none;border:1.5px dashed var(--border);color:var(--ink-faint);border-radius:10px;padding:8px;font-size:12px;font-weight:600;}
.restart-btn:hover{border-color:var(--dislike);color:var(--dislike);}

.content{flex:1;min-width:0;padding:28px 34px;max-width:1400px;}
.content-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
.content-title{font-family:'Space Grotesk';font-size:26px;font-weight:700;margin:0 0 4px;}
.content-sub{color:var(--ink-soft);font-size:13.5px;margin:0;}

/* ---------- Discover / swipe ---------- */
.discover-layout{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start;}
.deck-area{display:flex;flex-direction:column;align-items:center;}
.deck{position:relative;width:100%;max-width:380px;height:520px;margin-bottom:20px;}
.uni-card{
  position:absolute;inset:0;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-card);
  overflow:hidden;display:flex;flex-direction:column;user-select:none;touch-action:none;
  transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
}
.uni-card.dragging{transition:none;}
.uni-card .photo{height:210px;position:relative;flex-shrink:0;}
.uni-card .photo .badge-diff{position:absolute;top:14px;left:14px;padding:5px 12px;border-radius:100px;font-size:11.5px;font-weight:800;letter-spacing:.02em;}
.uni-card .photo .badge-country{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);padding:5px 11px;border-radius:100px;font-size:11px;font-weight:700;color:var(--ink-soft);}
.photo-emoji{position:absolute;bottom:10px;right:16px;font-size:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));opacity:.85;}
.card-aid-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--ink-soft);line-height:1.4;}
.swipe-stamp{position:absolute;top:22px;padding:6px 14px;border:3px solid;border-radius:8px;font-family:'Space Grotesk';font-weight:800;font-size:20px;letter-spacing:.05em;opacity:0;transform:rotate(-18deg);}
.swipe-stamp.like{left:20px;color:var(--like);border-color:var(--like);}
.swipe-stamp.nope{right:20px;color:var(--dislike);border-color:var(--dislike);transform:rotate(18deg);}
.uni-card .body{padding:18px 20px;flex:1;display:flex;flex-direction:column;}
.uni-card h3{font-family:'Space Grotesk';font-size:20px;margin:0 0 3px;}
.uni-card .loc{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px;display:flex;align-items:center;gap:5px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.tag{font-size:11px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);color:var(--ink-soft);padding:4px 10px;border-radius:100px;}
.stat-row{display:flex;justify-content:space-between;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}
.stat{text-align:left;}
.stat .v{font-family:'Space Grotesk';font-weight:700;font-size:15px;}
.stat .l{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.deck-empty{width:100%;max-width:380px;height:520px;border:2px dashed var(--border);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--ink-soft);}
.deck-empty h3{font-family:'Space Grotesk';color:var(--ink);margin:12px 0 6px;}
.swipe-actions{display:flex;gap:16px;align-items:center;}
.action-btn{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);box-shadow:var(--shadow-soft);display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.action-btn:hover{transform:translateY(-3px);}
.action-btn.big{width:64px;height:64px;}
.action-btn svg{width:24px;height:24px;}
.action-btn.dislike svg{stroke:var(--dislike);}
.action-btn.like svg{stroke:var(--like);}
.action-btn.info svg{stroke:var(--ink-soft);}

.side-panel{display:flex;flex-direction:column;gap:16px;}
.panel-card{background:var(--surface);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-soft);border:1px solid var(--border);}
.panel-card h4{font-family:'Space Grotesk';font-size:15px;margin:0 0 12px;}
.mini-match-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.mini-match-row:last-child{border:none;}
.mini-thumb{width:36px;height:36px;border-radius:9px;flex-shrink:0;}
.mini-match-info{flex:1;min-width:0;}
.mini-match-info .n{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-match-info .c{font-size:10.5px;color:var(--ink-faint);}
.mini-match-score{font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--primary);}
.progress-ring-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;}

/* ---------- Matches list ---------- */
.match-list-row{
  display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s, transform .15s;
}
.match-list-row:hover{box-shadow:var(--shadow-card);transform:translateY(-1px);}
.match-thumb{width:52px;height:52px;border-radius:12px;flex-shrink:0;}
.match-info{flex:1;min-width:0;}
.match-info h4{margin:0 0 2px;font-size:15px;font-family:'Space Grotesk';}
.match-info .loc{font-size:12px;color:var(--ink-faint);}
.match-score-block{text-align:center;min-width:64px;}
.match-score-block .v{font-family:'Space Grotesk';font-weight:800;font-size:17px;color:var(--primary);}
.match-score-block .l{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;}
.badge{padding:6px 13px;border-radius:100px;font-size:11.5px;font-weight:800;white-space:nowrap;text-align:center;}
.badge-Reach{background:var(--reach-bg);color:var(--reach);}
.badge-Target{background:var(--target-bg);color:var(--target);}
.badge-Likely{background:var(--likely-bg);color:var(--likely);}
.filter-tabs{display:flex;gap:8px;margin-bottom:18px;}
.filter-tab{padding:8px 16px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-soft);}
.filter-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);}

/* ---------- Guest banner ---------- */
.guest-banner{
  display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--primary-100),#F3F1FE);
  border:1.5px solid var(--primary-200);border-radius:var(--radius-md);padding:16px 20px;margin-bottom:20px;flex-wrap:wrap;
}
.guest-banner-icon{font-size:26px;flex-shrink:0;}
.guest-banner-text{flex:1;min-width:220px;}
.guest-banner-text h4{margin:0 0 3px;font-family:'Space Grotesk';font-size:14.5px;}
.guest-banner-text p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.guest-banner-form{display:flex;gap:8px;flex-shrink:0;}
.guest-banner-form input{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;width:190px;background:var(--surface);}
.guest-banner-form input:focus{outline:none;border-color:var(--primary);}
@media (max-width:600px){ .guest-banner-form input{width:140px;} }

/* ---------- University detail ---------- */
.uni-hero{border-radius:24px;overflow:hidden;position:relative;height:230px;margin-bottom:20px;color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;}
.uni-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,.55), rgba(0,0,0,.05));z-index:0;}
.uni-hero > *{position:relative;z-index:1;}
.uni-hero .back-btn{position:absolute;top:18px;left:18px;z-index:2;background:rgba(255,255,255,.85);border:none;border-radius:100px;padding:8px 14px;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:6px;}
.uni-hero h2{font-family:'Space Grotesk';font-size:28px;margin:0 0 4px;}
.uni-hero .loc{font-size:14px;opacity:.9;}
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--border);margin-bottom:22px;overflow-x:auto;}
.tab-btn{padding:11px 4px;margin-right:22px;background:none;border:none;font-weight:700;font-size:13.5px;color:var(--ink-faint);border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--primary);border-color:var(--primary);}
.detail-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;}
.info-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;margin-bottom:16px;}
.info-block h4{margin:0 0 14px;font-family:'Space Grotesk';font-size:15px;}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.kv .k{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
.kv .v{font-weight:700;font-size:14.5px;}
.reason-list{list-style:none;padding:0;margin:0;}
.reason-list li{display:flex;gap:8px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--border);color:var(--ink-soft);}
.reason-list li:last-child{border:none;}
.reason-list li svg{width:16px;height:16px;flex-shrink:0;stroke:var(--like);margin-top:1px;}
.bar-row{margin-bottom:12px;}
.bar-row .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.bar-row .top b{font-family:'Space Grotesk';}
.bar-track{height:7px;background:var(--border);border-radius:10px;overflow:hidden;}
.bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--primary),#8B7CF6);}
.big-score-card{text-align:center;padding:22px;}
.big-score-card .v{font-family:'Space Grotesk';font-size:44px;font-weight:800;color:var(--primary);line-height:1;}
.big-score-card .l{font-size:12px;color:var(--ink-faint);margin-top:2px;}
.savebtn-row{display:flex;gap:10px;margin-top:14px;}
.icon-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-2);font-weight:700;font-size:12.5px;color:var(--ink-soft);}
.icon-btn svg{width:15px;height:15px;}

/* ---------- DNA / profile ---------- */
.dna-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.dna-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;}
.dna-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
.dna-legend .item{font-size:11.5px;font-weight:700;color:var(--ink-soft);background:var(--surface-2);padding:6px 11px;border-radius:100px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;text-align:center;}
.stat-tile .v{font-family:'Space Grotesk';font-size:26px;font-weight:800;color:var(--primary);}
.stat-tile .l{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.list-caption{font-size:12.5px;color:var(--ink-faint);}

/* misc */
.empty-illustration{width:64px;height:64px;color:var(--primary);margin-bottom:6px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:100px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:50;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

@media (max-width:980px){
  .discover-layout{grid-template-columns:1fr;}
  .side-panel{display:none;}
  .detail-grid{grid-template-columns:1fr;}
  .dna-layout{grid-template-columns:1fr;}
}
@media (max-width:760px){
  #mainapp{flex-direction:column;}
  .sidebar{
    width:100%;height:auto;position:fixed;bottom:0;left:0;top:auto;flex-direction:row;
    padding:8px 6px;border-right:none;border-top:1px solid var(--border);z-index:20;justify-content:space-between;
  }
  .logo, .sidebar-foot{display:none;}
  .nav-item{flex-direction:column;font-size:9.5px;gap:3px;padding:6px 4px;flex:1;text-align:center;}
  .nav-item span{white-space:nowrap;}
  .content{padding:20px 16px 90px;}
  .ob-card{padding:28px 22px;}
  .row2{grid-template-columns:1fr;}
}

/* ============================================================
   SCORING
   ============================================================ */
function academicStrength(p){
  let gpaScore = Math.min(Math.max((p.gpa-2.0)/2.0,0),1)*100; // 2.0-4.0 -> 0-100
  const takenKeys = ['SAT','ACT','IELTS'].filter(k=>p.tests[k] && p.tests[k].taken);
  if(takenKeys.length===0) return Math.round(gpaScore); // ни один тест не сдан — считаем только по GPA
  const avgTestScore = takenKeys.reduce((sum,k)=>{
    const r = TEST_RANGES[k];
    const norm = Math.min(Math.max((p.tests[k].score-r.academicMin)/(r.academicMax-r.academicMin),0),1)*100;
    return sum+norm;
  },0) / takenKeys.length; // если сдано несколько тестов — усредняем их нормализованный балл
  return Math.round(gpaScore*0.5 + avgTestScore*0.5);
}

function matchScore(u, p){
  let score = 0;
  // CS fit — 28%
  score += (u.cs/100)*28;
  // Location fit (setting + climate) — 18%
  let locFit = 0;
  if(p.setting && u.setting===p.setting) locFit += 0.55;
  if(p.climate && u.climate===p.climate) locFit += 0.45;
  if(!p.setting && !p.climate) locFit = 0.6;
  score += locFit*18;
  // Cost fit — 18% (lower cost relative to budget = better, but not penalized much if under)
  let costRatio = p.budget>0 ? u.cost/p.budget : 1;
  let costFit = costRatio<=1 ? 1 : Math.max(0, 1-(costRatio-1)*0.8);
  score += costFit*18;
  // Research fit — 14%
  let researchFit = 1-Math.abs(u.research - p.research)/5;
  score += Math.max(0,researchFit)*14;
  // Size fit — 12%
  let sizeFit = p.size ? (u.size===p.size?1:0.4) : 0.7;
  score += sizeFit*12;
  // Financial aid fit — 10% (only matters if the student said aid is important to them)
  let aidFit = 0.7;
  if(p.needsAid===true){ aidFit = {High:1,Medium:0.6,Low:0.25}[u.aid.level] ?? 0.5; }
  score += aidFit*10;
  // Веса выше (28+18+18+14+12+10) суммируются ровно в 100% — никакого случайного
  // "разброса" для красоты, чтобы Match Score можно было честно объяснить на интервью.
  return Math.max(40, Math.min(99, Math.round(score)));
}

function admissionReality(u, p){
  const strength = academicStrength(p);
  const difficulty = 100 - u.acceptance*100;
  const gap = difficulty - strength;
  if(gap > 25) return 'Reach';
  if(gap > -10) return 'Target';
  return 'Likely';
}

function buildDeck(){
  const p = state.profile;
  let pool = UNIVERSITIES.filter(u=>{
    if(p.continents.length && !p.continents.includes(u.continent)) return false;
    if(p.countries.length && !p.countries.includes(u.country)) return false;
    return true;
  });
  state.deckFallback = false;
  if(pool.length===0){ pool = UNIVERSITIES.slice(); state.deckFallback = true; }
  pool = pool.map(u=>({...u, _match: matchScore(u,p), _reality: admissionReality(u,p)}));
  pool.sort((a,b)=>b._match-a._match);
  state.deck = pool;
}

  // deterministic little "ocean" dots for texture
  const dots = [];
  for(let i=0;i<46;i++){
    const x = (i*173.4)%860;
    const y = (i*97.7 + (i%5)*40)%440;
    dots.push(`<circle class="ocean-dot" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${1+(i%3)}"/>`);
  }

  let defs = `<radialGradient id="oceanGrad" cx="35%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#F3F4FE"/><stop offset="100%" stop-color="#D9DCF6"/>
    </radialGradient>`;
  Object.entries(CONTINENTS).forEach(([key,c])=>{
    defs += `<linearGradient id="grad-${key}" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="${c.colors[0]}"/><stop offset="100%" stop-color="${c.colors[1]}"/>
    </linearGradient>`;
  });

  let groups = '';
  Object.keys(shapes).forEach(key=>{
    const c = CONTINENTS[key];
    const selected = p.continents.includes(key);
    const count = UNIVERSITIES.filter(u=>u.continent===key).length;
    groups += `
      <g class="continent-group ${selected?'is-selected':''}" onclick="toggleContinent('${key}')">
        <path class="continent ${selected?'selected':''}" d="${shapes[key]}" fill="url(#grad-${key})"></path>
        <text class="continent-label" x="${c.cx}" y="${c.cy-4}" text-anchor="middle">${c.name}</text>
        <text class="continent-count" x="${c.cx}" y="${c.cy+11}" text-anchor="middle">${count} университетов</text>
        <g class="continent-check" transform="translate(${c.cx+58},${c.cy-34})">
          <circle r="11" fill="#fff"/>
          <path d="M-5,0 L-1.5,4 L5,-4" fill="none" stroke="#22C55E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>`;
  });
  return `<svg class="worldmap" viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg">
    <defs>${defs}</defs>
    <rect class="ocean-bg" x="0" y="0" width="860" height="440" rx="18"/>
    ${dots.join('')}
    ${groups}
  </svg>`;
}

function toggleContinent(key){
  const p = state.profile;
  const idx = p.continents.indexOf(key);
  if(idx>-1) p.continents.splice(idx,1); else p.continents.push(key);
  // drop countries that no longer belong to a selected continent
  p.countries = p.countries.filter(c => UNIVERSITIES.some(u=>u.country===c && p.continents.includes(u.continent)));
  renderOnboarding();
}
function toggleCountry(c){
  const p = state.profile;
  const idx = p.countries.indexOf(c);
  if(idx>-1) p.countries.splice(idx,1); else p.countries.push(c);
  renderOnboarding();
}
function setChip(field, value){
  state.profile[field] = state.profile[field]===value ? null : value;
  renderOnboarding();
}
function setAid(value){
  state.profile.needsAid = state.profile.needsAid===value ? null : value;
  renderOnboarding();
}
function updateProfile(field, value){
  state.profile[field] = value;
}
function toggleTestTaken(key, checked){
  state.profile.tests[key].taken = checked;

}
function updateTestScoreFor(key, input, isBlur){
  const r = TEST_RANGES[key];
  let v = parseFloat(input.value);
  if(isNaN(v)) v = r.min;
  if(v > r.max) v = r.max;   // например SAT не может быть больше 1600, даже если ввели больше
  if(v < r.min) v = r.min;
  state.profile.tests[key].score = v;
  if(isBlur) input.value = v; // поправить видимое значение только когда пользователь закончил ввод
}
function updateSlider(field, rawValue, displayId, formatFn){
  // update state + only the small value label, so dragging the range input never gets interrupted by a full re-render
  const value = field==='gpa' ? parseFloat(rawValue) : parseInt(rawValue);
  state.profile[field] = value;
  const el = document.getElementById(displayId);
  if(el) el.textContent = formatFn(rawValue);
}

function attachSwipeHandlers(topId){
  const card = document.getElementById('card-'+topId);
  if(!card) return;
  let startX=0, startY=0, curX=0, curY=0, dragging=false;

  function pointerDown(e){
    dragging = true;
    card.classList.add('dragging');
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
  }
  function pointerMove(e){
    if(!dragging) return;
    const pt = e.touches ? e.touches[0] : e;
    curX = pt.clientX - startX; curY = pt.clientY - startY;
    const rot = curX/16;
    card.style.transform = `translate(${curX}px, ${curY}px) rotate(${rot}deg)`;
    const likeStamp = document.getElementById('stamp-like');
    const nopeStamp = document.getElementById('stamp-nope');
    if(likeStamp) likeStamp.style.opacity = Math.max(0,Math.min(1,curX/80));
    if(nopeStamp) nopeStamp.style.opacity = Math.max(0,Math.min(1,-curX/80));
  }
  function pointerUp(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if(curX > 110) doSwipe('like');
    else if(curX < -110) doSwipe('dislike');
    else { card.style.transform=''; }
    curX=0; curY=0;
  }
  card.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  card.addEventListener('touchstart', pointerDown, {passive:true});
  card.addEventListener('touchmove', pointerMove, {passive:true});
  card.addEventListener('touchend', pointerUp);
}

function doSwipe(direction){
  const u = state.deck[0];
  if(!u) return;
  const card = document.getElementById('card-'+u.id);
  if(card){
    card.style.transform = direction==='like'
      ? 'translate(600px,-40px) rotate(28deg)'
      : 'translate(-600px,-40px) rotate(-28deg)';
    card.style.opacity = '0';
  }
  setTimeout(()=>{
    state.deck.shift();
    if(direction==='like'){ state.liked.push(u); toast(t('added_to_matches', u.name)); }
    else { state.disliked.push(u); }
    saveGuestSession();
    renderDiscover();
  }, 260);
}

          <div class="savebtn-row">
            <button class="icon-btn" onclick="toggleLike(${u.id})">${ICONS.heart} ${state.liked.find(x=>x.id===u.id)?t('in_matches_btn'):t('save_btn')}</button>
            <button class="icon-btn" onclick="toast(t('link_copied'))">${ICONS.share} ${t('share_btn')}</button>
          </div>
        </div>
        <div class="info-block">
          <h4>${t('match_breakdown')}</h4>
          ${matchBreakdown(u,p).map(b=>`<div class="bar-row"><div class="top"><span>${b.label}</span><b>${b.val}%</b></div><div class="bar-track"><div class="bar-fill" style="width:${b.val}%"></div></div></div>`).join('')}
        </div>
      </div>
    </div>`;
}

function matchBreakdown(u,p){
  let locFit;
  if(!p.setting && !p.climate) locFit = 60;
  else locFit = ((p.setting && u.setting===p.setting)?55:0) + ((p.climate && u.climate===p.climate)?45:0);
  const costRatio = p.budget>0? u.cost/p.budget:1;
  const costFit = Math.round((costRatio<=1?1:Math.max(0,1-(costRatio-1)*0.8))*100);
  const researchFit = Math.round(Math.max(0,1-Math.abs(u.research-p.research)/5)*100);
  let aidFit = 70;
  if(p.needsAid===true){ aidFit = Math.round(({High:1,Medium:0.6,Low:0.25}[u.aid.level] ?? 0.5)*100); }
  const rows = [
    {label:'CS Fit', val:u.cs},
    {label:'Location Fit', val: Math.min(100,locFit)},
    {label:'Cost Fit', val: costFit},
    {label:'Research Fit', val: researchFit}
  ];
  if(p.needsAid===true) rows.push({label:'Aid Fit', val: aidFit});
  return rows;
}

function buildWhyReasons(u,p){
  const reasons = [];
  if(u.cs>=90) reasons.push(t('why_cs', u.cs));
  if(p.setting && u.setting===p.setting) reasons.push(t('why_setting', u.setting));
  if(p.climate && u.climate===p.climate) reasons.push(t('why_climate', u.climate));
  if(u.research>=4) reasons.push(t('why_research', u.research));
  if(u.cost <= p.budget) reasons.push(t('why_cost'));
  if(p.needsAid===true && (u.aid.level==='High'||u.aid.merit)) reasons.push(`${t('scholarship_label')}: ${u.aid.note}`);
  if(reasons.length<3) reasons.push(t('why_generic'));
  return reasons.slice(0,5);
}

function setUniTab(id){ state.activeTab = id; renderUniversityDetail(); }
function toggleLike(id){
  const idx = state.liked.findIndex(x=>x.id===id);
  if(idx>-1){ state.liked.splice(idx,1); toast(t('removed_from_matches')); }
  else {
    const u = findUni(id);
    state.liked.push(u);
    toast(t('added_to_matches_short'));
  }
  saveGuestSession();
  renderUniversityDetail();
}

/* ============================================================
   UNIVERSITY DNA
   ============================================================ */
function computeDNA(){
  const liked = state.liked;
  if(liked.length===0){
    return {cs:50,coastal:50,research:50,urban:50,costSensitive:50,warm:50};
  }
  const n = liked.length;
  const pct = (fn)=> Math.round(100*liked.filter(fn).length/n);
  return {
    cs: Math.round(liked.reduce((s,u)=>s+u.cs,0)/n),
    coastal: pct(u=>u.setting==='Coastal'),
    research: Math.round(liked.reduce((s,u)=>s+u.research,0)/n*20),
    urban: pct(u=>u.setting==='Urban'),
    costSensitive: Math.round(100 - Math.min(100, (liked.reduce((s,u)=>s+u.cost,0)/n)/700)),
    warm: pct(u=>u.climate==='Warm')
  };
}

function renderRadar(dna){
  const axes = [
    {k:'cs', label:'CS-focused'}, {k:'coastal', label:'Coastal'}, {k:'research', label:'Research'},
    {k:'urban', label:'Urban'}, {k:'costSensitive', label:'Cost-sensitive'}, {k:'warm', label:'Warm climate'}
  ];
  const cx=170, cy=170, R=130;
  const n = axes.length;
  function pt(i, val){
    const angle = (Math.PI*2*i/n) - Math.PI/2;
    const r = (val/100)*R;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  }
  const poly = axes.map((a,i)=>pt(i, dna[a.k]).join(',')).join(' ');
  let rings = [0.25,0.5,0.75,1].map(f=>{
    const p = axes.map((a,i)=>pt(i, f*100).join(',')).join(' ');
    return `<polygon points="${p}" fill="none" stroke="#E7E7F1" stroke-width="1"/>`;
  }).join('');
  let spokes = axes.map((a,i)=>{
    const [x,y] = pt(i,100);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E7E7F1" stroke-width="1"/>`;
  }).join('');
  let labels = axes.map((a,i)=>{
    const [x,y] = pt(i,122);
    return `<text x="${x}" y="${y}" text-anchor="middle" font-size="11" font-weight="700" fill="#5B5B70" font-family="Inter">${a.label}</text>`;
  }).join('');
  let dots = axes.map((a,i)=>{
    const [x,y] = pt(i,dna[a.k]);
    return `<circle cx="${x}" cy="${y}" r="4" fill="#5B4FE0"/>`;
  }).join('');
  return `<svg viewBox="0 0 340 340" style="width:100%;max-width:340px;display:block;margin:0 auto;">
    ${rings}${spokes}
    <polygon points="${poly}" fill="rgba(91,79,224,0.25)" stroke="#5B4FE0" stroke-width="2.5"/>
    ${dots}${labels}
  </svg>`;
}

function renderDNA(){
  const dna = computeDNA();
  const liked = state.liked;
  document.getElementById('content').innerHTML = `
    <div class="content-header">
      <div><h1 class="content-title">${t('dna_title')}</h1><p class="content-sub">${t('dna_sub', liked.length)}</p></div>
    </div>
    ${liked.length>0 ? renderGuestBanner() : ''}
    <div class="stat-tiles">
      <div class="stat-tile"><div class="v">${liked.length}</div><div class="l">${t('dna_liked')}</div></div>
      <div class="stat-tile"><div class="v">${state.disliked.length}</div><div class="l">${t('dna_passed')}</div></div>
      <div class="stat-tile"><div class="v">${liked.length? Math.round(liked.reduce((s,u)=>s+u._match,0)/liked.length):0}%</div><div class="l">${t('dna_avg')}</div></div>
    </div>
    <div class="dna-layout">
      <div class="dna-card">
        <h4 style="font-family:'Space Grotesk';margin:0 0 4px;">${t('dna_profile_title')}</h4>
        <p class="list-caption" style="margin:0 0 10px;">${t('dna_profile_sub')}</p>
        ${renderRadar(dna)}
        <div class="dna-legend">
          ${Object.entries({'CS-focused':dna.cs,'Coastal':dna.coastal,'Research':dna.research,'Urban':dna.urban,'Cost-sensitive':dna.costSensitive,'Warm climate':dna.warm}).map(([k,v])=>`<span class="item">${k}: ${v}%</span>`).join('')}
        </div>
        <button class="icon-btn" style="margin-top:16px;" onclick="toast(t('dna_share_toast'))">${ICONS.share} ${t('dna_share')}</button>
      </div>
      <div class="dna-card">
        <h4 style="font-family:'Space Grotesk';margin:0 0 12px;">${t('dna_what_title')}</h4>
        <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;">${t('dna_what_p1')}</p>
        <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;">${t('dna_what_p2')}</p>
      </div>
    </div>`;
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  const saved = loadGuestSession();
  if(saved && saved.obDone && saved.profile){
    state.guestId = saved.guestId;
    state.isRegistered = !!saved.isRegistered;
    state.email = saved.email || null;
    state.lang = saved.lang || 'ru';
    // миграция старых гостевых сессий (до введения раздельных SAT/ACT/IELTS) на новую структуру profile.tests
    if(saved.profile && !saved.profile.tests && saved.profile.test){
      const oldType = saved.profile.test, oldScore = saved.profile.testScore;
      saved.profile.tests = {SAT:{taken:false,score:1350}, ACT:{taken:false,score:30}, IELTS:{taken:false,score:7}};
      if(oldType && oldType!=='NONE' && saved.profile.tests[oldType]){
        saved.profile.tests[oldType] = {taken:true, score:oldScore};
      }
      delete saved.profile.test; delete saved.profile.testScore;
    }
    state.profile = Object.assign(state.profile, saved.profile);
    state.liked = saved.liked || [];
    state.disliked = saved.disliked || [];
    buildDeck();
    const swipedIds = new Set([...state.liked, ...state.disliked].map(u=>u.id));
    state.deck = state.deck.filter(u=>!swipedIds.has(u.id));
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('mainapp').classList.remove('hidden');
    state.screen = 'discover';
    renderApp();
  } else {
    state.guestId = (saved && saved.guestId) || generateGuestId();
    state.lang = (saved && saved.lang) || 'ru';
    renderOnboarding();
  }
})();
</script>
